<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Foto Tamu Pernikahan</title>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  min-height: 100vh;

  background:
    linear-gradient(
      180deg,
      #fbf7f3,
      #f5eee8
    );

  font-family:
    Arial,
    sans-serif;

  color: #403630;

}


.container {

  width: 100%;

  max-width: 560px;

  margin: auto;

  padding:
    28px 16px 50px;

  text-align: center;

}


h1 {

  margin: 5px 0;

  font-family:
    Georgia,
    serif;

  font-size: 30px;

}


.subtitle {

  color: #85776e;

  font-size: 14px;

  margin-bottom: 24px;

}


/* =========================
   CAMERA
   ========================= */

.camera-box {

  position: relative;

  overflow: hidden;

  border-radius: 24px;

  background: #111;

  box-shadow:
    0 12px 35px
    rgba(0,0,0,.18);

}


video {

  width: 100%;

  aspect-ratio: 3 / 4;

  object-fit: cover;

  display: block;

}


.status {

  min-height: 24px;

  margin: 14px 0;

  font-size: 14px;

  color: #796d64;

}


.camera-switch {

  display: flex;

  gap: 10px;

  margin-top: 12px;

}


button {

  border: none;

  cursor: pointer;

  font-weight: bold;

  transition:
    transform .15s,
    opacity .15s;

}


button:active {

  transform: scale(.97);

}


button:disabled {

  opacity: .45;

  cursor: not-allowed;

}


.switch-btn {

  flex: 1;

  padding: 13px 8px;

  border-radius: 14px;

  background: #e5dad2;

  color: #54473f;

  font-size: 14px;

}


/* =========================
   TOMBOL FOTO
   ========================= */

.capture-btn {

  width: 100%;

  margin-top: 14px;

  padding: 18px;

  border-radius: 18px;

  background:
    linear-gradient(
      135deg,
      #9a7667,
      #755548
    );

  color: white;

  font-size: 18px;

  box-shadow:
    0 8px 20px
    rgba(117,85,72,.25);

}


.capture-btn span {

  display: inline-block;

  margin-right: 6px;

}


/* =========================
   PREVIEW
   ========================= */

.preview-section {

  display: none;

  margin-top: 22px;

}


.preview-title {

  font-size: 19px;

  font-weight: bold;

  margin-bottom: 12px;

}


.preview-box {

  overflow: hidden;

  border-radius: 22px;

  background: #111;

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.18);

}


.preview-box img {

  width: 100%;

  display: block;

}


.upload-status {

  margin-top: 13px;

  font-size: 14px;

  color: #766960;

}


.success {

  display: none;

  margin-top: 12px;

  padding: 14px;

  border-radius: 14px;

  background: #e7f3e8;

  color: #416c47;

  font-weight: bold;

}


.secondary {

  width: 100%;

  margin-top: 12px;

  padding: 15px;

  border-radius: 15px;

  background: #ddd0c7;

  color: #51443c;

}


/* =========================
   GALERI
   ========================= */

.gallery-section {

  margin-top: 40px;

  padding-top: 25px;

  border-top:
    1px solid #dfd4cc;

}


.gallery-title {

  font-family: Georgia, serif;

  font-size: 23px;

  font-weight: bold;

  margin-bottom: 6px;

}


.gallery-subtitle {

  color: #8b7e75;

  font-size: 13px;

  margin-bottom: 18px;

}


.gallery {

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 10px;

}


.gallery-item {

  position: relative;

  overflow: hidden;

  border-radius: 15px;

  background: #ddd;

  aspect-ratio: 1 / 1;

}


.gallery-item img {

  width: 100%;

  height: 100%;

  object-fit: cover;

  display: block;

  transition:
    transform .25s;

}


.gallery-item:active img {

  transform: scale(1.05);

}


.gallery-empty {

  padding: 30px 15px;

  border-radius: 16px;

  background: #eee7e1;

  color: #857970;

  font-size: 14px;

}


.refresh-btn {

  margin-top: 16px;

  padding:
    12px 20px;

  border-radius: 13px;

  background: #e0d4cb;

  color: #51443c;

}


.small {

  margin-top: 22px;

  color: #968981;

  font-size: 12px;

}


#uploadFrame {

  display: none;

}


canvas {

  display: none;

}


</style>

</head>


<body>


<div class="container">


  <h1>
    Wahyu &amp; Pasangan
  </h1>


  <div class="subtitle">
    Abadikan momen bersama kami ❤️
  </div>


  <!-- =========================
       KAMERA
       ========================= -->

  <div id="cameraArea">


    <div class="camera-box">

      <video
        id="video"
        autoplay
        playsinline
        muted>
      </video>

    </div>


    <div
      id="status"
      class="status">

      Meminta izin kamera...

    </div>


    <div class="camera-switch">

      <button
        id="frontBtn"
        class="switch-btn">

        🤳 Kamera Depan

      </button>


      <button
        id="backBtn"
        class="switch-btn">

        📷 Kamera Belakang

      </button>

    </div>


    <button
      id="captureBtn"
      class="capture-btn"
      disabled>

      <span>📸</span>
      AMBIL FOTO

    </button>


  </div>


  <!-- =========================
       PREVIEW
       ========================= -->

  <div
    id="previewSection"
    class="preview-section">


    <div class="preview-title">

      🖼️ Hasil Foto Anda

    </div>


    <div class="preview-box">

      <img
        id="previewImg"
        alt="Hasil foto">

    </div>


    <div
      id="uploadStatus"
      class="upload-status">

      ⏳ Mengirim foto ke galeri acara...

    </div>


    <div
      id="success"
      class="success">

      ✓ Foto berhasil disimpan ke galeri acara ❤️

    </div>


    <button
      id="retakeBtn"
      class="secondary">

      ↻ FOTO ULANG

    </button>


  </div>


  <!-- =========================
       GALERI
       ========================= -->

  <div class="gallery-section">


    <div class="gallery-title">

      📸 Galeri Tamu

    </div>


    <div class="gallery-subtitle">

      Lihat momen yang dibagikan oleh para tamu ❤️

    </div>


    <div
      id="gallery"
      class="gallery">

      <div class="gallery-empty">

        Memuat foto tamu...

      </div>

    </div>


    <button
      id="refreshGallery"
      class="refresh-btn">

      🔄 Muat Ulang Galeri

    </button>


  </div>


  <div class="small">

    Foto akan otomatis disimpan
    ke galeri acara.

  </div>


</div>


<canvas id="canvas"></canvas>


<!-- =========================
     FORM UPLOAD
     ========================= -->

<iframe
  id="uploadFrame"
  name="uploadFrame">
</iframe>


<form
  id="uploadForm"
  method="POST"
  target="uploadFrame"
  enctype="application/x-www-form-urlencoded"
  style="display:none;">


  <input
    type="hidden"
    name="photo"
    id="photoInput">


  <input
    type="hidden"
    name="fileName"
    id="fileNameInput">


</form>


<script>


/* =====================================================
   GOOGLE APPS SCRIPT
   ===================================================== */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbz5WbP-XGFmFtrkOFqmn2W3cRoJsLF6ZB8ibwM_yseYepmT5ypUfjN4WKnyf02fCgn_EA/exec";


/* =====================================================
   ELEMENT
   ===================================================== */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const captureBtn =
document.getElementById("captureBtn");

const frontBtn =
document.getElementById("frontBtn");

const backBtn =
document.getElementById("backBtn");

const retakeBtn =
document.getElementById("retakeBtn");

const statusEl =
document.getElementById("status");

const previewSection =
document.getElementById("previewSection");

const previewImg =
document.getElementById("previewImg");

const uploadStatus =
document.getElementById("uploadStatus");

const success =
document.getElementById("success");

const cameraArea =
document.getElementById("cameraArea");

const uploadForm =
document.getElementById("uploadForm");

const photoInput =
document.getElementById("photoInput");

const fileNameInput =
document.getElementById("fileNameInput");

const gallery =
document.getElementById("gallery");

const refreshGallery =
document.getElementById("refreshGallery");


uploadForm.action =
APPS_SCRIPT_URL;


/* =====================================================
   VARIABEL
   ===================================================== */

let stream = null;

let currentCamera = "environment";


/* =====================================================
   KAMERA
   ===================================================== */

async function startCamera(cameraMode) {

  try {

    captureBtn.disabled = true;

    statusEl.textContent =
      "Membuka kamera...";


    if (stream) {

      stream
        .getTracks()
        .forEach(
          track => track.stop()
        );

      stream = null;

    }


    currentCamera =
      cameraMode;


    try {

      stream =
        await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              exact: cameraMode
            },

            width: {
              ideal: 1280
            },

            height: {
              ideal: 1706
            }

          },

          audio: false

        });

    }

    catch (error) {

      stream =
        await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: cameraMode
            }

          },

          audio: false

        });

    }


    video.srcObject =
      stream;


    await video.play();


    captureBtn.disabled =
      false;


    statusEl.textContent =
      cameraMode === "user"

      ? "🤳 Kamera depan siap."

      : "📷 Kamera belakang siap.";


  }

  catch (error) {

    console.error(error);


    statusEl.innerHTML =
      "❌ Kamera tidak dapat digunakan.<br>" +
      "Pastikan izin kamera sudah diberikan.";

    captureBtn.disabled =
      true;

  }

}


/* =====================================================
   NAMA FILE
   ===================================================== */

function createFileName() {

  const now =
    new Date();


  function pad(number) {

    return String(number)
      .padStart(2, "0");

  }


  const date =
    now.getFullYear() +
    "-" +
    pad(now.getMonth() + 1) +
    "-" +
    pad(now.getDate());


  const time =
    pad(now.getHours()) +
    "-" +
    pad(now.getMinutes()) +
    "-" +
    pad(now.getSeconds());


  const random =
    Math.random()
      .toString(36)
      .substring(2, 7);


  return (
    "Foto-Tamu-" +
    date +
    "_" +
    time +
    "_" +
    random +
    ".jpg"
  );

}


/* =====================================================
   AMBIL FOTO
   ===================================================== */

captureBtn.addEventListener(
  "click",
  function() {


    if (
      !video.videoWidth ||
      !video.videoHeight
    ) {

      statusEl.textContent =
        "Kamera belum siap.";

      return;

    }


    const maxWidth =
      1280;


    const scale =
      Math.min(
        1,
        maxWidth /
        video.videoWidth
      );


    canvas.width =
      Math.round(
        video.videoWidth *
        scale
      );


    canvas.height =
      Math.round(
        video.videoHeight *
        scale
      );


    const context =
      canvas.getContext("2d");


    /*
     * Kamera depan dibuat mirror
     */

    if (
      currentCamera === "user"
    ) {

      context.save();

      context.translate(
        canvas.width,
        0
      );

      context.scale(-1, 1);


      context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );


      context.restore();

    }

    else {

      context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

    }


    const dataUrl =
      canvas.toDataURL(
        "image/jpeg",
        0.85
      );


    /*
     * Tampilkan hasil foto
     */

    previewImg.src =
      dataUrl;


    previewSection.style.display =
      "block";


    cameraArea.style.display =
      "none";


    uploadStatus.textContent =
      "⏳ Mengirim foto ke galeri acara...";


    success.style.display =
      "none";


    /*
     * Upload
     */

    photoInput.value =
      dataUrl;


    fileNameInput.value =
      createFileName();


    uploadForm.submit();

  }
);


/* =====================================================
   HASIL UPLOAD
   ===================================================== */

const uploadFrame =
document.getElementById("uploadFrame");


uploadFrame.onload =
function() {

  uploadStatus.textContent =
    "✓ Foto sudah dikirim ke galeri.";


  success.style.display =
    "block";


  /*
   * Refresh galeri setelah upload
   */

  setTimeout(
    loadGallery,
    1500
  );

};


/* =====================================================
   KAMERA DEPAN
   ===================================================== */

frontBtn.addEventListener(
  "click",
  function() {

    startCamera("user");

  }
);


/* =====================================================
   KAMERA BELAKANG
   ===================================================== */

backBtn.addEventListener(
  "click",
  function() {

    startCamera("environment");

  }
);


/* =====================================================
   FOTO ULANG
   ===================================================== */

retakeBtn.addEventListener(
  "click",
  function() {


    previewSection.style.display =
      "none";


    cameraArea.style.display =
      "block";


    captureBtn.disabled =
      true;


    startCamera(
      currentCamera
    );

  }
);


/* =====================================================
   GALERI
   ===================================================== */

function loadGallery() {


  gallery.innerHTML =
    '<div class="gallery-empty">' +
    '⏳ Memuat galeri...' +
    '</div>';


  /*
   * Nama callback dibuat unik.
   */

  const callbackName =
    "galleryCallback_" +
    Date.now();


  window[callbackName] =
    function(data) {

      try {

        renderGallery(data);

      }

      finally {

        delete window[callbackName];

        if (script) {

          script.remove();

        }

      }

    };


  const script =
    document.createElement("script");


  script.src =
    APPS_SCRIPT_URL +
    "?action=gallery" +
    "&callback=" +
    callbackName +
    "&t=" +
    Date.now();


  script.onerror =
    function() {

      gallery.innerHTML =
        '<div class="gallery-empty">' +
        '❌ Galeri tidak dapat dimuat.' +
        '</div>';


      delete window[callbackName];

      script.remove();

    };


  document.body.appendChild(
    script
  );

}


/* =====================================================
   TAMPILKAN GALERI
   ===================================================== */

function renderGallery(data) {


  if (
    !Array.isArray(data) ||
    data.length === 0
  ) {

    gallery.innerHTML =
      '<div class="gallery-empty">' +
      '📷 Belum ada foto tamu.<br>' +
      'Jadilah yang pertama mengabadikan momen!' +
      '</div>';

    return;

  }


  gallery.innerHTML =
    "";


  data.forEach(
    function(photo) {


      const item =
        document.createElement("a");


      item.className =
        "gallery-item";


      item.href =
        photo.view;


      item.target =
        "_blank";


      item.rel =
        "noopener";


      const img =
        document.createElement("img");


      img.loading =
        "lazy";


      img.src =
        photo.thumbnail;


      img.alt =
        "Foto tamu";


      item.appendChild(
        img
      );


      gallery.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   REFRESH GALERI
   ===================================================== */

refreshGallery.addEventListener(
  "click",
  loadGallery
);


/* =====================================================
   TUTUP KAMERA
   ===================================================== */

window.addEventListener(
  "beforeunload",
  function() {

    if (stream) {

      stream
        .getTracks()
        .forEach(
          track => track.stop()
        );

    }

  }
);


/* =====================================================
   MULAI
   ===================================================== */

startCamera(
  "environment"
);


/*
 * Muat galeri saat halaman dibuka.
 */

loadGallery();


</script>


</body>

</html>
