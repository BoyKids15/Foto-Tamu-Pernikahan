<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Foto Tamu Pernikahan</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f8f5f0;
      font-family: Arial, sans-serif;
      color: #3b332c;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
      padding: 25px 16px 40px;
      text-align: center;
    }

    h1 {
      margin: 5px 0 5px;
      font-size: 28px;
    }

    .subtitle {
      margin-bottom: 20px;
      color: #766b62;
      font-size: 14px;
    }

    .camera-box {
      width: 100%;
      background: #111;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,.15);
    }

    video {
      width: 100%;
      aspect-ratio: 3 / 4;
      display: block;
      object-fit: cover;
      background: #111;
    }

    .status {
      min-height: 25px;
      margin: 14px 0;
      font-size: 14px;
      color: #766b62;
      line-height: 1.5;
    }

    .camera-switch {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #8d6e63;
      color: white;
      transition: .2s;
    }

    button:active {
      transform: scale(.98);
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .switch-btn {
      background: #d9ccc3;
      color: #4d433c;
      flex: 1;
    }

    .capture-btn {
      margin-top: 12px;
      font-size: 18px;
      padding: 17px;
    }

    .secondary {
      margin-top: 10px;
      background: #ded5cd;
      color: #4d433c;
    }

    .preview-section {
      display: none;
      margin-top: 20px;
    }

    .preview-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .preview-box {
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      background: #111;
      box-shadow: 0 8px 25px rgba(0,0,0,.15);
    }

    .preview-box img {
      width: 100%;
      display: block;
    }

    .upload-status {
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      display: none;
      margin-top: 15px;
      padding: 15px;
      border-radius: 14px;
      background: #e8f3e8;
      color: #416b41;
      font-weight: bold;
    }

    .small {
      margin-top: 18px;
      font-size: 12px;
      color: #91867d;
    }

    #uploadFrame {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Wahyu &amp; Pasangan</h1>

  <div class="subtitle">
    Abadikan momen bersama kami ❤️
  </div>


  <!-- ==================== KAMERA ==================== -->

  <div id="cameraArea">

    <div class="camera-box">
      <video id="video" autoplay playsinline muted></video>
    </div>

    <div id="status" class="status">
      Meminta izin kamera...
    </div>


    <!-- PILIH KAMERA -->

    <div class="camera-switch">

      <button
        id="frontBtn"
        class="switch-btn">
        🤳 Kamera Depan
      </button>

      <button
        id="backBtn"
        class="switch-btn">
        📷 Kamera Belakang
      </button>

    </div>


    <!-- AMBIL FOTO -->

    <button
      id="captureBtn"
      class="capture-btn"
      disabled>

      📸 AMBIL FOTO

    </button>

  </div>


  <!-- ==================== HASIL FOTO ==================== -->

  <div
    id="previewSection"
    class="preview-section">

    <div class="preview-title">
      🖼️ Hasil Foto Anda
    </div>

    <div class="preview-box">

      <img
        id="previewImg"
        alt="Hasil foto">

    </div>


    <div
      id="uploadStatus"
      class="upload-status">

      Mengirim foto ke galeri acara...

    </div>


    <div
      id="success"
      class="success">

      ✓ Foto berhasil disimpan ke galeri acara ❤️

    </div>


    <button
      id="retakeBtn"
      class="secondary">

      ↻ FOTO ULANG

    </button>

  </div>


  <div class="small">
    Foto akan otomatis disimpan ke galeri acara.
  </div>

</div>


<canvas
  id="canvas"
  style="display:none;">
</canvas>


<!-- ==================== UPLOAD ==================== -->

<iframe
  id="uploadFrame"
  name="uploadFrame">
</iframe>


<form
  id="uploadForm"
  method="POST"
  target="uploadFrame"
  enctype="application/x-www-form-urlencoded"
  style="display:none;">

  <input
    type="hidden"
    name="photo"
    id="photoInput">

  <input
    type="hidden"
    name="fileName"
    id="fileNameInput">

</form>


<script>


/* =====================================================
   URL GOOGLE APPS SCRIPT
   ===================================================== */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbz5WbP-XGFmFtrkOFqmn2W3cRoJsLF6ZB8ibwM_yseYepmT5ypUfjN4WKnyf02fCgn_EA/exec";


/* =====================================================
   ELEMENT
   ===================================================== */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const captureBtn =
document.getElementById("captureBtn");

const frontBtn =
document.getElementById("frontBtn");

const backBtn =
document.getElementById("backBtn");

const retakeBtn =
document.getElementById("retakeBtn");

const statusEl =
document.getElementById("status");

const previewSection =
document.getElementById("previewSection");

const previewImg =
document.getElementById("previewImg");

const uploadStatus =
document.getElementById("uploadStatus");

const success =
document.getElementById("success");

const cameraArea =
document.getElementById("cameraArea");

const uploadForm =
document.getElementById("uploadForm");

const photoInput =
document.getElementById("photoInput");

const fileNameInput =
document.getElementById("fileNameInput");

const uploadFrame =
document.getElementById("uploadFrame");


uploadForm.action =
APPS_SCRIPT_URL;


/* =====================================================
   VARIABEL
   ===================================================== */

let stream = null;

let currentCamera = "environment";


/* =====================================================
   MEMBUKA KAMERA
   ===================================================== */

async function startCamera(cameraMode) {

  try {

    captureBtn.disabled = true;

    statusEl.textContent =
      "Membuka kamera...";


    /*
     * Matikan kamera sebelumnya
     */

    if (stream) {

      stream
        .getTracks()
        .forEach(track => track.stop());

      stream = null;

    }


    /*
     * Tentukan kamera
     */

    currentCamera =
      cameraMode;


    /*
     * Minta kamera
     */

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            exact: cameraMode
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 1706
          }

        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    captureBtn.disabled =
      false;


    if (cameraMode === "user") {

      statusEl.textContent =
        "🤳 Kamera depan siap.";

    } else {

      statusEl.textContent =
        "📷 Kamera belakang siap.";

    }

  }

  catch (error) {

    console.error(error);


    /*
     * Beberapa HP tidak mendukung exact.
     * Coba dengan ideal.
     */

    try {

      if (stream) {

        stream
          .getTracks()
          .forEach(track => track.stop());

      }


      stream =
        await navigator.mediaDevices.getUserMedia({

          video: {

            facingMode: {
              ideal: cameraMode
            }

          },

          audio: false

        });


      video.srcObject =
        stream;


      await video.play();


      captureBtn.disabled =
        false;


      statusEl.textContent =
        cameraMode === "user"
        ? "🤳 Kamera depan siap."
        : "📷 Kamera belakang siap.";

    }

    catch (secondError) {

      console.error(secondError);

      statusEl.innerHTML =
        "❌ Kamera tidak dapat digunakan.<br>" +
        "Pastikan izin kamera sudah diberikan.";

      captureBtn.disabled =
        true;

    }

  }

}


/* =====================================================
   NAMA FILE
   ===================================================== */

function createFileName() {

  const now =
    new Date();


  function pad(number) {

    return String(number)
      .padStart(2, "0");

  }


  const date =
    now.getFullYear() +
    "-" +
    pad(now.getMonth() + 1) +
    "-" +
    pad(now.getDate());


  const time =
    pad(now.getHours()) +
    "-" +
    pad(now.getMinutes()) +
    "-" +
    pad(now.getSeconds());


  const random =
    Math.random()
      .toString(36)
      .substring(2, 7);


  return (
    "Foto-Tamu-" +
    date +
    "_" +
    time +
    "_" +
    random +
    ".jpg"
  );

}


/* =====================================================
   AMBIL FOTO
   ===================================================== */

captureBtn.addEventListener(
  "click",
  function() {


    if (
      !video.videoWidth ||
      !video.videoHeight
    ) {

      statusEl.textContent =
        "Kamera belum siap.";

      return;

    }


    /*
     * Maksimum lebar foto 1280 px
     */

    const maxWidth =
      1280;


    const scale =
      Math.min(
        1,
        maxWidth / video.videoWidth
      );


    canvas.width =
      Math.round(
        video.videoWidth * scale
      );


    canvas.height =
      Math.round(
        video.videoHeight * scale
      );


    const context =
      canvas.getContext("2d");


    /*
     * Jika kamera depan,
     * gambar dibuat seperti selfie/mirror.
     */

    if (currentCamera === "user") {

      context.save();

      context.translate(
        canvas.width,
        0
      );

      context.scale(-1, 1);

      context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

      context.restore();

    } else {

      context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

    }


    /*
     * Buat JPEG
     */

    const dataUrl =
      canvas.toDataURL(
        "image/jpeg",
        0.85
      );


    /*
     * Tampilkan hasil foto
     */

    previewImg.src =
      dataUrl;


    previewSection.style.display =
      "block";


    cameraArea.style.display =
      "none";


    uploadStatus.textContent =
      "⏳ Mengirim foto ke galeri acara...";


    success.style.display =
      "none";


    /*
     * Siapkan data upload
     */

    photoInput.value =
      dataUrl;


    fileNameInput.value =
      createFileName();


    /*
     * Kirim ke Apps Script
     */

    uploadForm.submit();

  }
);


/* =====================================================
   RESPONS UPLOAD
   ===================================================== */

uploadFrame.onload =
  function() {

    uploadStatus.textContent =
      "✓ Foto sudah dikirim.";


    success.style.display =
      "block";

  };


/* =====================================================
   KAMERA DEPAN
   ===================================================== */

frontBtn.addEventListener(
  "click",
  function() {

    startCamera("user");

  }
);


/* =====================================================
   KAMERA BELAKANG
   ===================================================== */

backBtn.addEventListener(
  "click",
  function() {

    startCamera("environment");

  }
);


/* =====================================================
   FOTO ULANG
   ===================================================== */

retakeBtn.addEventListener(
  "click",
  function() {


    previewSection.style.display =
      "none";


    cameraArea.style.display =
      "block";


    captureBtn.disabled =
      true;


    statusEl.textContent =
      "Membuka kamera...";


    /*
     * Buka kembali kamera
     * yang terakhir digunakan
     */

    startCamera(
      currentCamera
    );

  }
);


/* =====================================================
   KETIKA HALAMAN DITUTUP
   ===================================================== */

window.addEventListener(
  "beforeunload",
  function() {

    if (stream) {

      stream
        .getTracks()
        .forEach(
          track => track.stop()
        );

    }

  }
);


/* =====================================================
   MULAI DENGAN KAMERA BELAKANG
   ===================================================== */

startCamera("environment");


</script>

</body>
</html>
